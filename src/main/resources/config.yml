    advertising:
      enabled: true
      allowed-domains: []
    caps:
      min-length: 8
      max-ratio: 0.7
    spam:
      repeat-window-seconds: 30
      burst-messages: 5
      burst-seconds: 5
    # Repeated word/advert hits file a "Chat Filter" report in /reports (the filter itself only blocks).
    # Staff accept it (the player is punished for Filter Bypass, see punish:) or decline it (nothing).
    reports:
      enabled: true
      strikes: 3
      window-minutes: 30
      categories: [high-risk, blocked-word, advertising]

staff:
  reports:
    cooldown-seconds: 60

punish:
  # Shown on the ban and mute screens. Blank = no appeal line.
  appeal-url: ''
  # Discord webhook for issued/revoked punishments and staff lockouts. Blank = no Discord posts.
  discord-webhook-url: ''
  # How long a player's login IPs are kept, for alt-ban-evasion detection and /altcheck.
  login-ip-retention-days: 90
  # /warn (and the menu's own Warning button) refuse outright if the player was already warned within this
  # many hours, and open the punish menu (with the same reason typed) so staff escalate instead of spamming
  # warnings. 0 = off.
  warn-cooldown-hours: 24
  # Every named offense and its duration ladder lives in OffenseCatalog.java, not here. An accepted chat
  # filter report (/reports accept) applies the Filter Bypass offense: 6h, 12h, 24h, then 72h mutes.
  # A circuit breaker for a compromised or rogue staff account: too many punishments too fast from one staff
  # name locks them out of issuing more until an admin clears it with /punish clearlockout.
  staff-lockout:
    enabled: true
    window-seconds: 30
    max-actions: 5
  alt-ban-evasion:
    # Auto-bans any other ONLINE account sharing an IP with a player who was just banned.
    enabled: true
    # Records each login's IP (needed for alt-ban-evasion and /altcheck). Off also disables both.
    ip-tracking: true

vaults:
  # Vaults everyone has. More with genscore.vaults.<number>, genscore.vaults.unlimited, or /buyvault.
  default: 1
  max-number: 50
  rows: 6
  buy:
    enabled: true
    base-cost: 3000
    cost-increment-per-slot: 2000
    max-bonus-slots: 5

announcements:
  interval-seconds: 300
  random: false
  # Each entry is one message (a line or a list of lines, MiniMessage). Edit, then /announce reload.
  messages:
    discord:
      - '<dark_gray>[<gold>Tip</gold>]</dark_gray> <gray>Join our Discord for events and giveaways.'
    rules:
      - '<dark_gray>[<gold>Tip</gold>]</dark_gray> <gray>Read the rules with <white>/rules</white>.'

crates:
  # The Daily Lockbox (/lockbox): guess a secret 3-symbol code. One game every 24 hours.
  lockbox:
    # The first game of a player is keyed by the date in this time zone.
    reset-timezone: America/New_York
    # 1 to 4 (the board has four rows).
    max-attempts: 4
    rewards:
      # Money for cracking it on the 1st, 2nd, 3rd, 4th guess. "$1000" or "1000". Credits do not exist here.
      by-guess: ['$2500', '$1000', '$500', '$250']
      # Paid when all guesses are used without cracking it. '$0' for nothing.
      participation: '$50'
    # Smallest gap between two guesses by one player.
    rate-limit-millis: 1000
    # Playtime needed before lockbox rewards are paid (0 = none). Games can still be played.
    min-playtime-minutes: 0

daily:
  enabled: true
  # A claim is allowed once per calendar day in this time zone; claiming on consecutive days builds the streak.
  reset-timezone: America/New_York
  streak:
    # Every tier except the first has its weight multiplied by (1 + streak * multiplier-per-day), capped at max-multiplier.
    multiplier-per-day: 0.05
    max-multiplier: 3.0
    # Guaranteed bonus commands the day a streak reaches this many days.
    milestones:
      7:
        display-name: '&b7-Day Streak'
        commands:
          - 'eco give {player} 2500'
      30:
        display-name: '&630-Day Streak'
        commands:
          - 'eco give {player} 6000'
  # The five layers, shallowest first: order is depth and depth is rarity (at most five are used).
  # Commands run from the console; {player} and {uuid} are replaced. They must be safe to run from the console on Folia.
  tiers:
    - id: 'coal'
      display-name: '&7Coal'
      weight: 50
      icon: 'COAL_BLOCK'
      reward-text: '$150 and 16 coal'
      commands:
        - 'eco give {player} 150'
        - 'item coal 16 {player}'
    - id: 'iron'
      display-name: '&fIron'
      weight: 30
      icon: 'RAW_IRON_BLOCK'
      reward-text: '$400 and 8 iron ingots'
      commands:
        - 'eco give {player} 400'
        - 'item iron_ingot 8 {player}'
    - id: 'gold'
      display-name: '&6Gold'
      weight: 13
      icon: 'RAW_GOLD_BLOCK'
      reward-text: '$1,000 and 6 gold ingots'
      commands:
        - 'eco give {player} 1000'
        - 'item gold_ingot 6 {player}'
    - id: 'diamond'
      display-name: '&bDiamond'
      weight: 6
      icon: 'DIAMOND_BLOCK'
      reward-text: '$2,500 and 3 diamonds'
      commands:
        - 'eco give {player} 2500'
        - 'item diamond 3 {player}'
      broadcast: true
    - id: 'netherite'
      display-name: '&5&lNETHERITE'
      weight: 1
      icon: 'NETHERITE_BLOCK'
      reward-text: '$10,000 and a netherite ingot'
      commands:
        - 'eco give {player} 10000'
        - 'item netherite_ingot 1 {player}'
      broadcast: true

trade:
  # How long a /trade request stays valid.
  request-seconds: 60
  # Seconds from both players confirming to the trade going through.
  countdown-seconds: 5
  # Seconds between /trade requests from one player.
  request-cooldown-seconds: 5
  # Teleporting further than this (or to another world) cancels the trade. 0 = never.
  cancel-teleport-distance: 16
  # true: a player who dies mid-trade drops their offered items with the rest of their inventory.
  # false: the items go back to them like a cancel (only safe if deaths keep inventories anyway).
  drop-escrow-on-death: true

mail:
  send-cooldown-seconds: 10
  max-length: 256
  # Mail is refused once a player has this many unread messages.
  max-unread-per-player: 50

polls:
  # Money paid for voting in a poll (BlockvilleCore paid 5 credits; this server has no credits). 0 = no reward.
  reward: 100

leaderboards:
  # How long a board is cached before it is read again.
  cache-seconds: 60
  # Rows per page (at most 10).
  size: 10
  # How many players each board loads; pages are size rows each.
  rows: 100

# Anti x-ray: ore-watch vein alerts plus the "Nightwatch" anti-autominer (BlockvilleCore's ore-watch: and anti-miner:).
tutorial:
  # New players get the guided tutorial after the intro. Others can start it with /tutorial.
  auto-start: true
  # Tokens for each finished step, and for finishing the whole tutorial.
  step-tokens: 2
  final-tokens: 10
  # Run by the console when the tutorial is finished.
  final-commands:
    - 'crate give {player} vote 2'

discord:
  enabled: true
  invite: 'https://discord.gg/gatemc'
  # How long a /link code works.
  code-minutes: 10
  # How often link and boost changes from the Discord bot are picked up.
  poll-seconds: 15
  # A player can't /unlink until this long after linking.
  unlink-cooldown-hours: 24
  # Paid once per Minecraft account and once per Discord account.
  link-reward:
    - {command: 'gensreward {player} tokens 25', display: '&e25 Tokens'}
    - {keys: {crate: vote, amount: 2}}
  role-sync:
    # Discord role id -> LuckPerms group, given in game while the linked player has the role.
    groups: {}
    # Ranks written to the database so the bot can give matching Discord roles.
    ranks: [vip, vipplus, mvp, mvpplus, legend]
    rank-sync-seconds: 300
  nitro:
    # Given while a linked player is boosting, removed when they stop or unlink.
    permissions:
      - genscore.turbo
      - genscore.nitro
    # No kits on GateMC: the /nitro menu shows the monthly reward instead.
    kit: ''
    broadcast: true
    # Every this many days of boosting (adds up across boosts), the booster gets these once, automatically.
    monthly:
      enabled: true
      days: 30
      rewards:
        - {command: 'pets egg give {player} epic 1', display: '&5Epic Pet Egg'}
    # Steps on the /nitro path, by total days boosted. Each step is claimed once per Discord account, while boosting.
    path:
      - id: boost
        days: 0
        name: 'Booster'
        icon: AMETHYST_SHARD
        description: ['Thanks for boosting!']
        rewards:
          - {command: 'gensreward {player} tokens 25', display: '&e25 Tokens'}
          - {command: 'pets egg give {player} rare 1', display: '&9Rare Pet Egg'}
      - id: week
        days: 7
        name: '1 Week'
        icon: AMETHYST_CLUSTER
        rewards:
          - {command: 'gensreward {player} tokens 30', display: '&e30 Tokens'}
          - {keys: {crate: vote, amount: 2}}
      - id: month
        days: 30
        name: '1 Month'
        icon: DIAMOND
        rewards:
          - {command: 'gensreward {player} tokens 50', display: '&e50 Tokens'}
          - {keys: {crate: cosmetic, amount: 1}}
      - id: two-months
        days: 60
        name: '2 Months'
        icon: EMERALD
        rewards:
          - {keys: {crate: amethyst, amount: 1}}
          - {command: 'credits give {player} 50', display: '&b50 Credits'}
      - id: three-months
        days: 90
        name: '3 Months'
        icon: NETHERITE_INGOT
        rewards:
          - {keys: {crate: amethyst, amount: 2}}
      - id: six-months
        days: 180
        name: '6 Months'
        icon: NETHER_STAR
        rewards:
          - {keys: {crate: op, amount: 1}}
          - {command: 'pets egg give {player} legendary 1', display: '&6Legendary Pet Egg'}
      - id: year
        days: 365
        name: '1 Year'
        icon: DRAGON_EGG
        rewards:
          - {keys: {crate: op, amount: 2}}
          - {command: 'pets egg give {player} legendary 1', display: '&6Legendary Pet Egg'}
          - {command: 'credits give {player} 250', display: '&b250 Credits'}

antihack:
  enabled: true
  # Checks that are stopped, not just reported: speed and fly pull the player back, reach cancels the hit.
  enforce: [speed, fly, reach]
  strict: false
  setback: false
  kick: false
  alert-level: medium

# Lag machine watch. It only reports. Every report also goes to plugins/GensCore/lagwatch.log.
lagwatch:
  enabled: true
  ignore-worlds: []
  discord-webhook-url: ''
  # Paper: alert when the average tick time stays above this (ms) for 30 s. 0 = off.
  slow-mspt: 45
  # Folia: alert when a region's measured TPS stays below this for 30 s. 0 = off.
  slow-tps: 18.0
  thresholds:
    redstone: 3000
    pistons: 300
    hopper-moves: 6000
    dispensers: 600
    item-drops: 2000
    falling-blocks: 200
    tnt: 80
    mob-spawns: 100
    vehicle-spawns: 60
    portals: 150
    items: 600
    vehicles: 80
    armor-stands: 100
    item-frames: 400
    mobs: 250
    villagers: 80
    projectiles: 300
    falling-standing: 150
    hoppers: 600

# Wipes. /gensadmin wipeplayer <player> full [preview|confirm], /wipe <player> (menu), /gensadmin wipeseason [preview|confirm]
# (every player; confirm from the console), /gensadmin wiperestore <player|season> [file], /wipereason <id>.
wipe:
  # Ticks to wait after kicking / closing vault views before touching anything (20 = 1 s).
  settle-ticks: 40
  # How long to wait for a kicked player's data to be released before giving up (nothing is deleted then).
  max-wait-ticks: 400
  # PostgreSQL statement timeout inside a wipe or restore transaction.
  run-timeout-seconds: 120
  # How long a preview stays valid for its confirm.
  confirm-window-minutes: 10
  # Under plugins/GensCore/modules/wipe/. Nothing ever deletes these files.
  backup-folder: backups
  # After their inventory is emptied on join, send them to the main world's spawn.
  send-to-spawn: true
  discord-webhook-url: ''
  season:
    # What a season wipe (and the menu's defaults) keeps, by module and section id as the preview prints them; "*" keeps
    # a whole module; "categories" keeps whole wipe categories (places, economy, progress, items, identity, purchases,
    # factions), which also covers modules added later. A season wipe that keeps nothing is refused.
    keep:
      core: [playtime, nickname, msg_prefs, economy_prefs, ignores]
      settings: [settings]
      mail: [inbox]
  # Extra player tables a wipe takes (data-driven; also how modules added later join without code). key-column holds
  # the player's UUID as TEXT. "reset:" sets columns instead of deleting the row. The entries below map the other groups'
  # current tables; each owning module should confirm it keeps no copy of these rows in memory while the player is offline.
  sections:
    - {module: trade, id: claims, label: trade claim box, table: pvp_trade_claims, key-column: uuid, category: items}
    - {module: vouchers, id: returns, label: vouchers owed back, table: pvp_voucher_returns, key-column: uuid, category: items}
    - {module: daily, id: claims, label: daily reward claims, table: pvp_daily_claims, key-column: uuid, category: progress}
    - {module: daily, id: stats, label: daily reward streak, table: pvp_daily_stats, key-column: uuid, category: progress}
    - {module: plots, id: plot, label: 'plot upgrades, gen tier, defences and shield', table: gens_plots, key-column: uuid, category: progress}
    - {module: plots, id: progress, label: 'tokens, caches, milestones, gear and rebirths', table: gens_players, key-column: uuid, category: progress}
    - {module: settings, id: settings, label: personal settings, table: pvp_settings, key-column: uuid, category: identity}
    - {module: mail, id: inbox, label: mail inbox, table: pvp_mail, key-column: recipient_uuid, category: identity}
  # Receipt wording overrides, e.g. receipts: {core: {describe: "..."}}
  receipts: {}

# Each feature is a module and can be switched off here. A module that is off is never loaded.
# ---- group E (integration/group-e.md) ----
# /rules, /guide (/helpmenu), /ranks menus and /discord. "command" runs as the player when the item is clicked.
# "chat" lines are shown instead of the menu to Bedrock players (and to everyone if a menu has no items).
info:
  # Register /rules here. Set false if the essentials module keeps its own /rules.
  rules-command: true
  discord:
    url: 'https://discord.gg/gatemc'
    label: '&9&l[CLICK FOR DISCORD]'
    message:
      - '&6&lDISCORD &8» &7Join the community: {discord}'
  menus:
    rules:
      title: '&c&l❄ &f&lRULES &c&l❄'
      size: 54
      items:
        title:   { slot: 4,  material: WRITABLE_BOOK, glow: true, name: '&6&l❄ RULES ❄', lore: ['&7Here''s what''s fair game and what isn''t.'] }
        ok:      { slot: 10, material: LIME_CONCRETE, name: '&a&l✔ ALLOWED' }
        no:      { slot: 16, material: RED_CONCRETE,  name: '&c&l✘ NOT ALLOWED' }
        raid:    { slot: 19, material: TNT,           name: '&a✔ Raiding',        lore: ['&7Raid bases that are raidable.'] }
        steal:   { slot: 20, material: CHEST,         name: '&a✔ Stealing',       lore: ['&7Loot whatever you can reach.'] }
        scam:    { slot: 28, material: GOLD_INGOT,    name: '&a✔ Scamming',       lore: ['&7Trades are at your own risk.', '&7Trust no one.'] }
        pvp:     { slot: 29, material: END_CRYSTAL,   name: '&a✔ PvP everywhere', lore: ['&7Except inside spawn.'] }
        traps:   { slot: 37, material: COBWEB,        name: '&a✔ Traps',          lore: ['&7Traps and ambushes are fair game.'] }
        hacks:   { slot: 24, material: COMMAND_BLOCK, name: '&c✘ Hacked clients', lore: ['&7No cheat clients, macros,', '&7auto-clickers or auto-crystal.'] }
        freecam: { slot: 25, material: ENDER_EYE,     name: '&c✘ Freecam & X-ray', lore: ['&7No freecam, x-ray, ESP or', '&7see-through mods/packs.'] }
        flood:   { slot: 33, material: WATER_BUCKET,  name: '&c✘ Flooding',       lore: ['&7No flooding or lava-casting', '&7land or bases.'] }
        dupe:    { slot: 34, material: STRUCTURE_VOID, name: '&c✘ Duping & exploits', lore: ['&7Found a bug? Report it to staff.'] }
        log:     { slot: 42, material: IRON_SWORD,    name: '&c✘ Combat logging', lore: ['&7Logging out mid-fight kills you.'] }
        dox:     { slot: 43, material: BARRIER,       name: '&c✘ Doxxing & real threats', lore: ['&7Keep it in the game.'] }
        final:   { slot: 49, material: NETHER_STAR,   glow: true, name: '&6Staff decisions are final', lore: ['&7Questions? Ask a staff member.'] }
      chat:
        - '&8&m                                        '
        - '&4&lRULES'
        - '&c1. &7No hacks / x-ray   &c2. &7No duping or exploits'
        - '&c3. &7No flooding   &c4. &7No combat logging'
        - '&c5. &7No doxxing or real threats   &c6. &7Staff decisions are final'
        - '&8&m                                        '
    guide:
      title: '&c&l❄ &f&lGUIDE &c&l❄'
      size: 54
