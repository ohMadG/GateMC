        pvp:     { slot: 29, material: END_CRYSTAL,   name: '&a✔ PvP everywhere', lore: ['&7Except inside spawn.'] }
        traps:   { slot: 37, material: COBWEB,        name: '&a✔ Traps',          lore: ['&7Traps and ambushes are fair game.'] }
        hacks:   { slot: 24, material: COMMAND_BLOCK, name: '&c✘ Hacked clients', lore: ['&7No cheat clients, macros,', '&7auto-clickers or auto-crystal.'] }
        freecam: { slot: 25, material: ENDER_EYE,     name: '&c✘ Freecam & X-ray', lore: ['&7No freecam, x-ray, ESP or', '&7see-through mods/packs.'] }
        flood:   { slot: 33, material: WATER_BUCKET,  name: '&c✘ Flooding',       lore: ['&7No flooding or lava-casting', '&7land or bases.'] }
        dupe:    { slot: 34, material: STRUCTURE_VOID, name: '&c✘ Duping & exploits', lore: ['&7Found a bug? Report it to staff.'] }
        log:     { slot: 42, material: IRON_SWORD,    name: '&c✘ Combat logging', lore: ['&7Logging out mid-fight kills you.'] }
