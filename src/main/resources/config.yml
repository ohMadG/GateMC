# GensCore main config.

storage:
  # sqlite: a single file in the plugin folder, good for testing.
  # postgres: for the live server.
  type: sqlite
  sqlite-file: data.db

  # Postgres only.
  host: localhost
  port: 5432
  database: genscore
  username: genscore
  # Leave empty and set the environment variable GENSCORE_DB_PASSWORD instead, so the password is never in this file.
  password: ''
  pool-size: 8

  # How often online players' data is saved (it is also saved on quit and at shutdown).
  autosave-minutes: 5

# Chat message style (MiniMessage). Used by every module.
messages:
  good-prefix: '<#9BE15D>✔ '
  bad-prefix: '<#FF5A4D>✘ '
  neutral-prefix: '<#FFC21F>» '
  good-color: '<gray>'
  bad-color: '<gray>'
  neutral-color: '<gray>'

# Plots (gens roadmap phase 1). Every online player gets a factory on a shared platform: a plaza in the middle with
# four roads running out of it, and factory lots on both sides of every road, all facing their road. Players walk the
# roads to reach each other's factories (raiding, phase 3). When a platform is full the next one opens.
#
#              F | F
#              F | F
#              F | F
#     F F F  +-------+  F F F
#     -----  | plaza |  -----        F = factory lot, | and - = roads
#     F F F  +-------+  F F F
#              F | F
#              F | F
#              F | F
#
# Factories are built from one template on join and removed after their owner leaves. Factory blocks are never saved;
# the owner's data (belt length, lock level, shield) is. The platform floor, roads and hub stay.
#
# The world must exist at start-up: Folia cannot create worlds while running. Use the main world (level-name) and
# make it void before it is first generated, in server.properties:
#   level-type=minecraft:flat
#   generator-settings={"layers":[{"block":"minecraft:air","height":1}],"biome":"minecraft:the_void"}
plots:
  world: world
  size: 25                   # factories are size x size blocks (restart to change)
  layout:                    # restart to change
    origin-x: 1152           # centre of platform 0. Folia: about 128 blocks into a 256-block section (1024 + 128)
    origin-z: 1152
    floor-y: 64              # factories are built from this height; the platform floor is one block below
    lots-per-side: 3         # factory lots on each side of each road: 4 roads x 2 sides x 3 = 24 per platform
    road-width: 7            # an odd number
    lot-gap: 3               # blocks between neighbouring lots along a road
    platform-spacing: 1024   # between platform centres. Folia: a multiple of 256, so each platform is its own region
    platform-columns: 8      # platforms per row
    max-platforms: 16        # 16 x 24 = 384 factories at most
  platform:                  # what new or rebuilt platforms are made of (/plotadmin platform rebuild)
    plaza-block: polished_andesite
    road-block: gray_concrete
    lot-block: smooth_stone  # under every lot, so an empty lot still has a floor
    hub-file: hub.nbt        # optional build on the plaza; make it with /plotadmin template save hub. A "spawn" marker in
                             # it is where players with nowhere else to go arrive.
  set-world-spawn: true      # once platform 0 exists, move the world spawn to its hub so new players never fall
  template:
    # Without a template file the built-in fortress is used: walls, corner towers, a 7-wide garage gate, a 61-segment
    # belt path, gen pads and a gate button. A hand-built template needs the same markers to have a belt and a gate.
    file: template.nbt       # in plugins/GensCore/modules/plots/. Make it with /plotadmin template pos1|pos2|save factory.
                             # Build it with its front (gate side) facing south (+Z); each lot turns it to face its road.
    fallback-floor: smooth_stone  # the built-in fortress's floor (not grass: grass under blocks turns to dirt)
    fallback-border: stone_bricks
    # Marker blocks in the template mark places instead of being built as-is; each is replaced with replace-with.
    # "spawn" is where players arrive. "belt" and "pad" are read by the belt and gens phases.
    markers:
      spawn: {block: lime_glazed_terracotta, replace-with: 'minecraft:air'}
      belt: {block: magenta_glazed_terracotta, replace-with: 'minecraft:smooth_stone_slab[type=bottom]'}
      pad: {block: light_blue_glazed_terracotta, replace-with: 'minecraft:polished_diorite'}
      gate: {block: red_glazed_terracotta, replace-with: 'minecraft:air'}          # the doorway the garage door fills
      gate_button: {block: orange_glazed_terracotta, replace-with: 'minecraft:polished_blackstone_button[face=floor]'}
      turret: {block: purple_glazed_terracotta, replace-with: 'minecraft:air'}   # where a turret stands (up to 4 used)
  build:
    blocks-per-tick: 2000        # template blocks placed per tick while building a plot
    clear-checks-per-tick: 8000  # positions checked per tick while clearing one
    clear-height: 64             # how far above floor-y a clear reaches (raised to the template height if lower)
    max-concurrent: 4            # plots built or cleared at the same time; the rest queue. Each one loads a ring of
                                 # chunks around the plot, so a high number can run the server out of memory.
                                 # Pre-generate the grid area once (e.g. with Chunky) to make builds cheaper.
  # Seconds a plot stays after its owner leaves. 0 = removed at once. Phase 3 (raiding) replaces this with the
  # disconnect timer and /logout.
  remove-delay-seconds: 0
  teleport-on-join: true
  spawn-yaw: 180             # which way players face on arrival, in the template's frame (180 = north, into a
                             # factory whose front faces south). Turned with each lot.
  void-y: 0                  # a player below this height in the plot world is sent back to their plot
  protect-world: true        # only genscore.plots.build may break or place blocks in the plot world
  defaults:
    belt-length: 8           # a new player's starting belt length

# Factory (gens roadmap phase 2, plus the gate from phase 3). Reloads with /gensadmin reload.
factory:
  # Raid lockpicks (Raid Gear menu). Hold one and right-click a closed enemy gate: a lock-picking game opens. A
  # tension marker sweeps along a track; click when it's on the sweet spot to set a pin (each pin moves the spot and
  # speeds the marker up). Set every pin before time runs out = the gate is jammed open (owner can't close it) for
  # jam-seconds. Too many misses or running out of time snaps the pick. Closing the game, moving away or getting hit
  # stops it (pick kept). The owner is warned and can click their gate to jam the lock (pick snaps).
  # Shielded factories can't be picked.
  lockpick:
    enabled: true
    price-tokens: 10
    # Lockpick upgrades (Rusty -> Iron -> Steel -> Gold -> Diamond -> Netherite), tokens for each next tier. Each tier
    # adds 2s; every 2 tiers +1 miss; marker slower; tiers 3 and 5 widen the sweet spot. Stacks with skill.
    upgrade-costs: [60, 150, 350, 800, 1600]
    pins: 3
    pins-per-lock-level: 1
    max-pins: 8
    strikes: 1
    gear-levels-per-extra-strike: 5
    speed-ticks: 2
    seconds: 10
    seconds-per-pin: 2
    jam-seconds: 15
    cooldown-seconds: 30
    range: 4
    # Skill: the values above are for a brand-new lockpicker (hard). Each skill level adds 1s; every 3 levels the
    # marker gets slower and you get 1 more miss; level 5 and 10 widen the sweet spot. Points: success/fail.
    skill:
      max-level: 10
      points-per-level: 6
      success-points: 3
      fail-points: 1
  # Paid rank boosts (best rank wins; LuckPerms group.<id>, inherited ranks count). tokens: % more tokens from
  # everything earned in play (belt, caches, raids, defends, milestones, playtime, daily tasks; not store/crates).
  # sale: % more sale value on the belt. hourly-tokens: extra tokens per hour played (base is 2).
  rank-perks:
    vip:     { tokens: 10, sale: 5,  hourly-tokens: 1 }
    vipplus: { tokens: 20, sale: 10, hourly-tokens: 2 }
    mvp:     { tokens: 35, sale: 15, hourly-tokens: 3 }
    mvpplus: { tokens: 50, sale: 20, hourly-tokens: 4 }
    legend:  { tokens: 75, sale: 25, hourly-tokens: 6 }
  gate:
    close-seconds: 45        # the owner closes the gate; it opens by itself after this. Closed: only the owner gets in.
    door-block: light_gray_concrete   # the garage door slats
  belt:
    start-speed: 0.5         # segments per second; one item per segment, so this is also items sold per second
    speed:                   # speed upgrades, generated: 1.25x, 1.5x ... up to max-multiplier x the start speed
      max-multiplier: 10     # 10x = 5 segments a second
      step: 0.25             # 36 upgrades from 1x to 10x
      base-price: 250        # the first speed upgrade
      price-growth: 1.5      # each costs this much more than the last (10x after about 95 hours of play)
      price-growth-start: 1.5   # each speed upgrade costs this much more than the last at first...
      price-growth-end: 1.8     # ...rising to this by ramp-levels: quick early, slow late
      ramp-levels: 22
    # speed-levels:          # or list them by hand instead (this replaces the generated ones):
    #   - {speed: 0.75, price: 150}
    length-step: 2           # segments added per length upgrade
    length-base-price: 40   # first length upgrade
    length-price-growth: 1.5 # each length upgrade costs this much more than the last (full belt after about a day)
    length-price-growth-start: 1.5
    length-price-growth-end: 1.8
    length-ramp: 18
    gen-interval-seconds: 0.1    # fastest the gen can make items (10 a second); it waits while the start of the belt is full
    value-per-segment: 0.10  # each working belt segment adds 10% of the item's base value
    deposit-every-seconds: 5 # earnings are paid into the balance this often (one ledger line each time)
  gen:                       # the machine items come out of. Upgrade it in the belt menu for better items.
    generate:                # tiers are generated along the items list, blending neighbours: the gen makes a mix of
                             # two items whose next item's share grows each tier (100% Coal, 67% Coal + 33% Raw Copper...)
      count: 150
      base-value: 1          # the first item's value; each tier's average is worth about value-growth times the last
      value-growth: 1.12
      # Prices: tier 2 costs base-price; each next tier costs (price-growth + early extra) times the one before, the
      # early extra fading over early-fade-tiers. Quick at the start, then each tier takes longer than the last.
      # An efficient player (tools/balance_sim.py): tier 11 ~1h, 26 ~4h, 51 ~20h, 101 ~180h, 150 ~800h of play.
      base-price: 25
      price-growth: 1.135
      early-extra-growth: 0.25
      early-fade-tiers: 40
      price-growth-start: 1.22  # replaces price-growth/early-extra: cheap first tiers, each step a bit steeper
      price-growth-end: 1.26
      ramp-tiers: 70
      items: [cobblestone, coal, raw_copper, copper_ingot, raw_iron, iron_ingot, redstone, lapis_lazuli, raw_gold,
              gold_ingot, quartz, amethyst_shard, slime_ball, honeycomb, resin_clump, armadillo_scute, turtle_scute,
              rabbit_foot, glowstone_dust, magma_cream, prismarine_shard, prismarine_crystals, emerald, diamond,
              blaze_rod, breeze_rod, ender_pearl, ghast_tear, phantom_membrane, golden_apple, nautilus_shell,
              copper_block, iron_block, gold_block, trial_key, ominous_trial_key, shulker_shell, echo_shard,
              heart_of_the_sea, dragon_breath, emerald_block, diamond_block, netherite_scrap, netherite_ingot,
              end_crystal, heavy_core, totem_of_undying, enchanted_golden_apple, nether_star, netherite_block,
              beacon, dragon_egg]
    # tiers:                 # or list them by hand instead (this replaces the generated ones):
    #   - {name: Raw Copper, item: raw_copper, value: 1.0, price: 0}
  drops:                     # special items that ride the belt now and then (drop luck in /tokens raises both)
    token-chance: 0.0012    # per item made: about 1 in 830 is a token
    cache-chance: 0.0004    # about 1 in 2500 is a cache
  caches:                    # broken in /caches
    weights: {common: 160, rare: 32, epic: 7, legendary: 1}
    money-minutes: {common: 2, rare: 10, epic: 30, legendary: 120}   # cash = this many minutes of your income (x0.5-1.5)
    tokens:
      common: {min: 1, max: 2}
      rare: {min: 3, max: 6}
      epic: {min: 8, max: 15}
      legendary: {min: 20, max: 35}
    key-chance: {common: 0.05, rare: 0.2, epic: 0.5, legendary: 1.0}
    key-crates: [amethyst]   # crate keys a cache can give (keycrates module); one is picked at random
  token-shop:                # prices in tokens; level n costs base-price * price-growth^n
    value: {max-level: 50, base-price: 15, price-growth: 1.3, per-level: 0.02}    # +2% sale value a level
    luck: {max-level: 20, base-price: 20, price-growth: 1.35, per-level: 0.10}    # +10% drop chance a level
    cache-price: 25          # a Common cache
  defences:                  # prices in tokens
    gate-time: {max-level: 15, base-price: 5, price-growth: 1.35, per-level: 5}   # +5s closed a level (45s to 120s)
    armor: {max-level: 10, base-price: 8, price-growth: 1.4, per-level: 0.5}      # +50% segment health a level
    turrets: {max-level: 8, base-price: 15, price-growth: 1.45, per-level: 1}     # levels 1-4 add turrets; all levels add damage
    traps: {max-level: 5, base-price: 10, price-growth: 1.5, per-level: 1}        # slowness; level 3+ throws raiders out
    turret-range: 18
    turret-damage: 2         # half-hearts a shot at level 1
    turret-damage-per-level: 0.5
    turret-cooldown-ticks: 40    # between shots, minus 3 a level
  raid:                      # raids need the target's gate to be open
    segment-health: 6        # hits to break a segment with no gear and no armour
    hit-cooldown-ms: 250     # fastest a raider can hit
    segments-per-raid: 3     # after this many the factory gets a shield
    shield-minutes: 5
    new-player-shield-minutes: 15
    auto-repair-seconds: 90  # broken segments mend themselves after this
    repair-cost-minutes: 0.5 # repairing early costs this many minutes of the owner's income
    repair-lock-seconds: 5   # no repairs until this long after the last hit
    loot-share: 0.4          # share of a broken segment's items the raider takes with no gear
    tokens-per-segment: 1
    steal-percent: 0.03      # each broken segment steals this share of the owner's balance
    steal-max-minutes: 10    # ...but no more than this many minutes of the owner's income
    steal-min: 25            # the cap is never below this, so new bases are still worth raiding
  gear:                      # raid gear, paid in money
    max-level: 25
    base-price: 2000
    price-growth: 1.6
    per-level: 1             # extra damage per hit a level
    loot-share-per-level: 0.025
  visuals:
    max-items-drawn: 64      # item entities per belt; the money is worked out from data either way
    view-distance: 64        # belts are drawn only while a player is this close
    model-yaw-offset: 0      # extra turn for every model, in degrees, if a resource pack's models face the wrong way
  resource-pack:             # the conveyor models (build with: python tools/build_pack.py)
    url: ''                  # where players download target/GensCore-pack.zip from
    sha1: ''                 # target/GensCore-pack.sha1
    required: false
    prompt: 'GensCore needs its resource pack for conveyor belts.'

economy:
  starting-balance: 0
  currency-singular: Dollar
  currency-plural: Dollars
  pay:
    min-amount: 1.0
    max-amount: 1000000.0
    # Payments this large ask for /pay confirm (players can turn this off with /pay confirmtoggle).
    confirm-threshold: 10000.0
  balance-top:
    cache-size: 100
    cache-seconds: 60
    entries-per-page: 10

teleport:
  # Seconds a player must stand still before a teleport. 0 = instant. genscore.teleport.bypasswarmup skips it.
  warmup-seconds:
    home: 5
    warp: 5
    spawn: 5
    tpa: 5
    back: 5
    other: 0
  cancel-on-move: true
  cancel-on-damage: true
  homes:
    enabled: false    # /home, /sethome, /homeicon and /allhomes; off on GateMC
    # More with the permission genscore.homes.<number>, or genscore.homes.unlimited.
    max-default: 3
  tpa:
    timeout-seconds: 60
    cooldown-seconds: 30
  back:
    on-death: true
  spawn:
    respawn-at-spawn: true
    first-join-at-spawn: true

essentials:
  heal:
    extinguish: true
    clear-effects: false
  speed:
    min: 0.1
    max: 10
  fix:
    cooldown-seconds: 300
  nickname:
    min-length: 3
    max-length: 16
    cooldown-seconds: 3600
  afk:
    # Mark players AFK after this many minutes without moving. 0 = off.
    auto-minutes: 5
  # Lines shown by /rules (MiniMessage).
  rules:
    - '<gold><bold>Server rules</bold>'
    - '<gray>1. <white>No cheating or exploiting.'
    - '<gray>2. <white>Be respectful in chat.'

join-leave:
  enabled: true
  join: '<dark_gray>[<green>+</green>]</dark_gray> <gray>{player}'
  first-join: '<dark_gray>[<gold>★</gold>]</dark_gray> <yellow>Welcome <white>{player}</white> to GateMC! <gray>(#{joins})'
  quit: '<dark_gray>[<red>-</red>]</dark_gray> <gray>{player}'

