# GensCore main config.

storage:
  # sqlite: a single file in the plugin folder, good for testing.
  # postgres: for the live server.
  type: sqlite
  sqlite-file: data.db

  # Postgres only.
  host: localhost
  port: 5432
  database: genscore
  username: genscore
  # Leave empty and set the environment variable GENSCORE_DB_PASSWORD instead, so the password is never in this file.
  password: ''
  pool-size: 8

  # How often online players' data is saved (it is also saved on quit and at shutdown).
  autosave-minutes: 5

# Chat message style (MiniMessage). Used by every module.
messages:
  good-prefix: '<#10b900>✔ '
  bad-prefix: '<#b90000>✘ '
  neutral-prefix: '<#e0b000>» '
  good-color: '<#10b900>'
  bad-color: '<#b90000>'
  neutral-color: '<#e0b000>'

# Plots (gens roadmap phase 1). Every online player gets a factory on a shared platform: a plaza in the middle with
# four roads running out of it, and factory lots on both sides of every road, all facing their road. Players walk the
# roads to reach each other's factories (raiding, phase 3). When a platform is full the next one opens.
#
#              F | F
#              F | F
#              F | F
#     F F F  +-------+  F F F
#     -----  | plaza |  -----        F = factory lot, | and - = roads
#     F F F  +-------+  F F F
#              F | F
#              F | F
#              F | F
#
# Factories are built from one template on join and removed after their owner leaves. Factory blocks are never saved;
# the owner's data (belt length, lock level, shield) is. The platform floor, roads and hub stay.
#
# The world must exist at start-up: Folia cannot create worlds while running. Use the main world (level-name) and
# make it void before it is first generated, in server.properties:
#   level-type=minecraft:flat
#   generator-settings={"layers":[{"block":"minecraft:air","height":1}],"biome":"minecraft:the_void"}
plots:
  world: world
  size: 25                   # factories are size x size blocks (restart to change)
  layout:                    # restart to change
    origin-x: 1152           # centre of platform 0. Folia: about 128 blocks into a 256-block section (1024 + 128)
    origin-z: 1152
    floor-y: 64              # factories are built from this height; the platform floor is one block below
    lots-per-side: 3         # factory lots on each side of each road: 4 roads x 2 sides x 3 = 24 per platform
    road-width: 7            # an odd number
    lot-gap: 3               # blocks between neighbouring lots along a road
    platform-spacing: 1024   # between platform centres. Folia: a multiple of 256, so each platform is its own region
    platform-columns: 8      # platforms per row
    max-platforms: 16        # 16 x 24 = 384 factories at most
  platform:                  # what new or rebuilt platforms are made of (/plotadmin platform rebuild)
    plaza-block: polished_andesite
    road-block: gray_concrete
    lot-block: smooth_stone  # under every lot, so an empty lot still has a floor
    hub-file: hub.nbt        # optional build on the plaza; make it with /plotadmin template save hub. A "spawn" marker in
                             # it is where players with nowhere else to go arrive.
  set-world-spawn: true      # once platform 0 exists, move the world spawn to its hub so new players never fall
  template:
    file: template.nbt       # in plugins/GensCore/modules/plots/. Make it with /plotadmin template pos1|pos2|save factory.
                             # Build it with its front (gate side) facing south (+Z); each lot turns it to face its road.
    fallback-floor: grass_block   # used while there is no template file (its front edge is yellow concrete)
    fallback-border: stone_bricks
    # Marker blocks in the template mark places instead of being built as-is; each is replaced with replace-with.
    # "spawn" is where players arrive. "belt" and "pad" are read by the belt and gens phases.
    markers:
      spawn: {block: lime_glazed_terracotta, replace-with: 'minecraft:air'}
      belt: {block: magenta_glazed_terracotta, replace-with: 'minecraft:smooth_stone'}
      pad: {block: light_blue_glazed_terracotta, replace-with: 'minecraft:polished_andesite'}
  build:
    blocks-per-tick: 2000        # template blocks placed per tick while building a plot
    clear-checks-per-tick: 8000  # positions checked per tick while clearing one
    clear-height: 64             # how far above floor-y a clear reaches (raised to the template height if lower)
    max-concurrent: 4            # plots built or cleared at the same time; the rest queue. Each one loads a ring of
                                 # chunks around the plot, so a high number can run the server out of memory.
                                 # Pre-generate the grid area once (e.g. with Chunky) to make builds cheaper.
  # Seconds a plot stays after its owner leaves. 0 = removed at once. Phase 3 (raiding) replaces this with the
  # disconnect timer and /logout.
  remove-delay-seconds: 0
  teleport-on-join: true
  spawn-yaw: 180             # which way players face on arrival, in the template's frame (180 = north, into a
                             # factory whose front faces south). Turned with each lot.
  void-y: 0                  # a player below this height in the plot world is sent back to their plot
  protect-world: true        # only genscore.plots.build may break or place blocks in the plot world
  defaults:
    belt-length: 8           # a new player's starting belt length

economy:
  starting-balance: 0
  currency-singular: Dollar
  currency-plural: Dollars
  pay:
    min-amount: 1.0
    max-amount: 1000000.0
    # Payments this large ask for /pay confirm (players can turn this off with /pay confirmtoggle).
    confirm-threshold: 10000.0
  balance-top:
    cache-size: 100
    cache-seconds: 60
    entries-per-page: 10

teleport:
  # Seconds a player must stand still before a teleport. 0 = instant. genscore.teleport.bypasswarmup skips it.
  warmup-seconds:
    home: 5
    warp: 5
    spawn: 5
    tpa: 5
    back: 5
    other: 0
  cancel-on-move: true
  cancel-on-damage: true
  homes:
    # More with the permission genscore.homes.<number>, or genscore.homes.unlimited.
    max-default: 3
  tpa:
    timeout-seconds: 60
    cooldown-seconds: 30
  back:
    on-death: true
  spawn:
    respawn-at-spawn: true
    first-join-at-spawn: true

essentials:
  heal:
    extinguish: true
    clear-effects: false
  speed:
    min: 0.1
    max: 10
  fix:
    cooldown-seconds: 300
  nickname:
    min-length: 3
    max-length: 16
    cooldown-seconds: 3600
  afk:
    # Mark players AFK after this many minutes without moving. 0 = off.
    auto-minutes: 5
  # Lines shown by /rules (MiniMessage).
  rules:
    - '<gold><bold>Server rules</bold>'
    - '<gray>1. <white>No cheating or exploiting.'
    - '<gray>2. <white>Be respectful in chat.'

chat:
  # MiniMessage. <prefix> and <suffix> come from LuckPerms, <name> is the nickname if set.
  format: '<badge><tag><prefix><name><gray>: </gray><message>'
  cooldown-ms: 1000
  filter:
    enabled: true
    # Matched after removing look-alike letters, leetspeak, repeats and spacing (so "b a d" and "b4d" count).
    zero-tolerance-words: []
    banned-words: []
    # Words that contain a banned word but are fine (e.g. "assassin" if "ass" is banned).
    safe-words: []
    advertising:
      enabled: true
      allowed-domains: []
    caps:
      min-length: 8
      max-ratio: 0.7
    spam:
      repeat-window-seconds: 30
      burst-messages: 5
      burst-seconds: 5

staff:
  reports:
    cooldown-seconds: 60

vaults:
  # Vaults everyone has. More with genscore.vaults.<number>, genscore.vaults.unlimited, or /buyvault.
  default: 1
  max-number: 50
  rows: 6
  buy:
    enabled: true
    base-cost: 3000
    cost-increment-per-slot: 2000
    max-bonus-slots: 5

announcements:
  interval-seconds: 300
  random: false
  # Each entry is one message (a line or a list of lines, MiniMessage). Edit, then /announce reload.
  messages:
    discord:
      - '<dark_gray>[<gold>Tip</gold>]</dark_gray> <gray>Join our Discord for events and giveaways.'
    rules:
      - '<dark_gray>[<gold>Tip</gold>]</dark_gray> <gray>Read the rules with <white>/rules</white>.'

crates:
  # The Daily Lockbox (/lockbox): guess a secret 3-symbol code. One game every 24 hours.
  lockbox:
    # The first game of a player is keyed by the date in this time zone.
    reset-timezone: America/New_York
    # 1 to 4 (the board has four rows).
    max-attempts: 4
    rewards:
      # Money for cracking it on the 1st, 2nd, 3rd, 4th guess. "$1000" or "1000". Credits do not exist here.
      by-guess: ['$2500', '$1000', '$500', '$250']
      # Paid when all guesses are used without cracking it. '$0' for nothing.
      participation: '$50'
    # Smallest gap between two guesses by one player.
    rate-limit-millis: 1000
    # Playtime needed before lockbox rewards are paid (0 = none). Games can still be played.
    min-playtime-minutes: 0

daily:
  enabled: true
  # A claim is allowed once per calendar day in this time zone; claiming on consecutive days builds the streak.
  reset-timezone: America/New_York
  streak:
    # Every tier except the first has its weight multiplied by (1 + streak * multiplier-per-day), capped at max-multiplier.
    multiplier-per-day: 0.05
    max-multiplier: 3.0
    # Guaranteed bonus commands the day a streak reaches this many days.
    milestones:
      7:
        display-name: '&b7-Day Streak'
        commands:
          - 'eco give {player} 2500'
      30:
        display-name: '&630-Day Streak'
        commands:
          - 'eco give {player} 6000'
  # The five layers, shallowest first: order is depth and depth is rarity (at most five are used).
  # Commands run from the console; {player} and {uuid} are replaced. They must be safe to run from the console on Folia.
  tiers:
    - id: 'coal'
      display-name: '&7Coal'
      weight: 50
      icon: 'COAL_BLOCK'
      reward-text: '$150 and 16 coal'
      commands:
        - 'eco give {player} 150'
        - 'item coal 16 {player}'
    - id: 'iron'
      display-name: '&fIron'
      weight: 30
      icon: 'RAW_IRON_BLOCK'
      reward-text: '$400 and 8 iron ingots'
      commands:
        - 'eco give {player} 400'
        - 'item iron_ingot 8 {player}'
    - id: 'gold'
      display-name: '&6Gold'
      weight: 13
      icon: 'RAW_GOLD_BLOCK'
      reward-text: '$1,000 and 6 gold ingots'
      commands:
        - 'eco give {player} 1000'
        - 'item gold_ingot 6 {player}'
    - id: 'diamond'
      display-name: '&bDiamond'
      weight: 6
      icon: 'DIAMOND_BLOCK'
      reward-text: '$2,500 and 3 diamonds'
      commands:
        - 'eco give {player} 2500'
        - 'item diamond 3 {player}'
      broadcast: true
    - id: 'netherite'
      display-name: '&5&lNETHERITE'
      weight: 1
      icon: 'NETHERITE_BLOCK'
      reward-text: '$10,000 and a netherite ingot'
      commands:
        - 'eco give {player} 10000'
        - 'item netherite_ingot 1 {player}'
      broadcast: true

trade:
  # How long a /trade request stays valid.
  request-seconds: 60
  # Seconds from both players confirming to the trade going through.
  countdown-seconds: 5
  # Seconds between /trade requests from one player.
  request-cooldown-seconds: 5
  # Teleporting further than this (or to another world) cancels the trade. 0 = never.
  cancel-teleport-distance: 16
  # true: a player who dies mid-trade drops their offered items with the rest of their inventory.
  # false: the items go back to them like a cancel (only safe if deaths keep inventories anyway).
  drop-escrow-on-death: true

mail:
  send-cooldown-seconds: 10
  max-length: 256
  # Mail is refused once a player has this many unread messages.
  max-unread-per-player: 50

polls:
  # Money paid for voting in a poll (BlockvilleCore paid 5 credits; this server has no credits). 0 = no reward.
  reward: 100

vote:
  enabled: true
  # Days start and streaks count in this timezone.
  timezone: "America/New_York"
  # GensCore's own Votifier listener (no Votifier plugin needed). Open the port in the firewall.
  # On first start it creates modules/vote/votifier/rsa/public.key (paste it into each voting site) and
  # modules/vote/votifier/token.txt (the v2 token for sites that ask for one; keep it secret, you may replace it).
  listener:
    enabled: false
    host: "0.0.0.0"
    port: 8192
    max-per-ip-per-minute: 30
    # Votes from the same name on the same site this close together count once (sites retry on timeouts).
    duplicate-window-minutes: 60
    # Votes older than this that were never claimed (the name never joined) are not paid.
    expire-days: 30
  # Shown in /vote. "service" is the name the site sends with its votes (logged the first time an unknown one arrives).
  sites: {}
  #  example:
  #    name: "ExampleList"
  #    url: "https://example.org/vote/000000"
  #    service: "ExampleList"
  #    cooldown-hours: 24
  #    icon: "EMERALD"
  # Paid for every vote. money is dollars, xp is vanilla experience points, commands run from the console
  # ({player}, {uuid}, {site}). display = lines shown in /vote for what the commands give.
  reward:
    money: 250
    xp: 0
    commands: []
    display: []
    message: "Thanks for voting on <white>{site}</white>! +<white>{money}</white>."
  streak:
    milestones:
      3:
        money: 500
      7:
        money: 1500
      14:
        money: 3000
      30:
        money: 7500
  party:
    enabled: true
    goal: 50
    money: 500
    commands: []
  # Shown to everyone when someone votes. Empty = off.
  announce: "<white>{player}</white> voted for the server! <gray>Type</gray> <white>/vote</white> <gray>to vote too.</gray>"
  reminder:
    on-join: true

leaderboards:
  # How long a board is cached before it is read again.
  cache-seconds: 60
  # Rows per board (at most 10).
  size: 10

# Anti x-ray: ore-watch vein alerts plus the "Nightwatch" anti-autominer (BlockvilleCore's ore-watch: and anti-miner:).
antihack:
  enabled: true
  strict: false
  setback: false
  kick: false
  alert-level: medium

# Lag machine watch. It only reports. Every report also goes to plugins/GensCore/lagwatch.log.
lagwatch:
  enabled: true
  ignore-worlds: []
  discord-webhook-url: ''
  # Paper: alert when the average tick time stays above this (ms) for 30 s. 0 = off.
  slow-mspt: 45
  # Folia: alert when a region's measured TPS stays below this for 30 s. 0 = off.
  slow-tps: 18.0
  thresholds:
    redstone: 3000
    pistons: 300
    hopper-moves: 6000
    dispensers: 600
    item-drops: 2000
    falling-blocks: 200
    tnt: 80
    mob-spawns: 100
    vehicle-spawns: 60
    portals: 150
    items: 600
    vehicles: 80
    armor-stands: 100
    item-frames: 400
    mobs: 250
    villagers: 80
    projectiles: 300
    falling-standing: 150
    hoppers: 600

# Wipes. /gensadmin wipeplayer <player> full [preview|confirm], /wipe <player> (menu), /gensadmin wipeseason [preview|confirm]
# (every player; confirm from the console), /gensadmin wiperestore <player|season> [file], /wipereason <id>.
wipe:
  # Ticks to wait after kicking / closing vault views before touching anything (20 = 1 s).
  settle-ticks: 40
  # How long to wait for a kicked player's data to be released before giving up (nothing is deleted then).
  max-wait-ticks: 400
  # PostgreSQL statement timeout inside a wipe or restore transaction.
  run-timeout-seconds: 120
  # How long a preview stays valid for its confirm.
  confirm-window-minutes: 10
  # Under plugins/GensCore/modules/wipe/. Nothing ever deletes these files.
  backup-folder: backups
  # After their inventory is emptied on join, send them to the main world's spawn.
  send-to-spawn: true
  discord-webhook-url: ''
  season:
    # What a season wipe (and the menu's defaults) keeps, by module and section id as the preview prints them; "*" keeps
    # a whole module; "categories" keeps whole wipe categories (places, economy, progress, items, identity, purchases,
    # factions), which also covers modules added later. A season wipe that keeps nothing is refused.
    keep:
      core: [playtime, nickname, msg_prefs, economy_prefs, ignores]
      settings: [settings]
      mail: [inbox]
      vote: [stats]
  # Extra player tables a wipe takes (data-driven; also how modules added later join without code). key-column holds
  # the player's UUID as TEXT. "reset:" sets columns instead of deleting the row. The entries below map the other groups'
  # current tables; each owning module should confirm it keeps no copy of these rows in memory while the player is offline.
  sections:
    - {module: trade, id: claims, label: trade claim box, table: pvp_trade_claims, key-column: uuid, category: items}
    - {module: vouchers, id: returns, label: vouchers owed back, table: pvp_voucher_returns, key-column: uuid, category: items}
    - {module: daily, id: claims, label: daily reward claims, table: pvp_daily_claims, key-column: uuid, category: progress}
    - {module: daily, id: stats, label: daily reward streak, table: pvp_daily_stats, key-column: uuid, category: progress}
    - {module: plots, id: plot, label: plot upgrades (belt length, lock level, shield), table: gens_plots, key-column: uuid, category: progress}
    - {module: plots, id: progress, label: rebirths, table: gens_players, key-column: uuid, category: progress}
    - {module: vote, id: stats, label: vote totals and streak, table: pvp_vote_stats, key-column: uuid, category: progress}
    - {module: settings, id: settings, label: personal settings, table: pvp_settings, key-column: uuid, category: identity}
    - {module: mail, id: inbox, label: mail inbox, table: pvp_mail, key-column: recipient_uuid, category: identity}
  # Receipt wording overrides, e.g. receipts: {core: {describe: "..."}}
  receipts: {}

# Each feature is a module and can be switched off here. A module that is off is never loaded.
# ---- group E (integration/group-e.md) ----
# /rules, /guide (/helpmenu), /ranks menus and /discord. "command" runs as the player when the item is clicked.
# "chat" lines are shown instead of the menu to Bedrock players (and to everyone if a menu has no items).
info:
