  broadcast-enabled: false
  broadcast-interval-minutes: 45
  broadcast-message: '<gold>[Community]</gold> <yellow>Vouch players or check their credibility with <green>/vouch \<player></green>. View ratings with <green>/vouches \<player></green>.'

# /wordle (/word, /words). HxCore's defaults. The first game each day is the shared daily word; after it players can
# play more games with random words until their Wordle earnings for the day reach daily-cap (0 = no cap).
wordle:
  # Money for solving in 1, 2, 3, 4, 5, 6 guesses.
  rewards: [3000, 2000, 1500, 1000, 700, 400]
  daily-cap: 15000
  # true = guesses must be in modules/wordle/words.txt (it's small, so real words could be refused)
  only-real-words: false
  # Day boundary for the daily word and the cap, e.g. Europe/London. Empty = the server's time zone.
  timezone: ''

# Chat games (BlockvilleCore's, with HxCore's timings, reward range, words and riddles).
chatgames:
  enabled: true
  every-minutes: 7
  # The first round after a start/reload; then one every every-minutes.
  offset-minutes: 4
  min-players: 1
  answer-seconds: 60
  # Random reward in this range for each win.
  reward-min: 250
  reward-max: 1000
  # Largest number in math and variable rounds.
  number-max: 50
  # Answers faster than this (ms after the round starts) are ignored: no person reads and types that fast.
  min-answer-ms: 700
  # Empty = all: unscramble, unreverse, reaction, fillout, random_string, math, variable, trivia
  enabled-types: []
  sound: entity.player.levelup
  win-sound: ui.toast.challenge_complete
  words: [diamond, netherite, creeper, skeleton, pumpkin, enderman, obsidian, crystal, totem, elytra, beacon, villager,
          zombie, spider, emerald, redstone, trident, shulker, anvil, potion, cobweb, lantern, phantom, warden, blaze,
          ghast, piglin, wither, dragon, pickaxe, shield, arrow, cauldron, spawner, witch, scythe, candle, gravestone]
  # Trivia rounds. Empty = HxCore's riddles plus some of BlockvilleCore's trivia (built in).
  trivia:
    - { q: 'I explode when you get too close and I hiss before I do. What am I?', a: 'creeper' }
    - { q: 'I''m green, I''m ugly and I''ll trade you anything for emeralds. What am I?', a: 'villager' }
    - { q: 'Hold me in your hand when you''re about to die and I''ll save you. What am I?', a: 'totem' }
    - { q: 'I''m the strongest material in the game and I come from ancient debris. What am I?', a: 'netherite' }
    - { q: 'Look me in the eyes and I''ll come for you. What mob am I?', a: 'enderman' }
    - { q: 'I let you fly but only if you''re falling first. What am I?', a: 'elytra' }
    - { q: 'I''m orange, I grow on the ground and I get carved at Halloween. What am I?', a: 'pumpkin' }
    - { q: 'I cry fireballs in the Nether. What am I?', a: 'ghast' }
    - { q: 'I''m the dark block you get when water flows onto a lava source. What am I?', a: 'obsidian' }
    - { q: 'I live in a deep dark city and I''m blind. What am I?', a: 'warden' }
    - { q: 'I love gold and I live in the Nether. What am I?', a: 'piglin' }
    - { q: 'Put me on a pyramid of iron or diamond blocks and I''ll give you powers. What am I?', a: 'beacon' }
# ---- group K (integration/group-k.md) ----
worldrules:
  # The whole spawn (island + clouds). Inside it nether portals don't light or work, and anyone below fall-y inside
  # its x/z area is sent back to spawn.
  spawn:
    world: world
    min: [-98, -64, -48]
    max: [88, 319, 255]
    fall-y: 84
    block-nether-portals: true
    # /worldrules spawn close|open. While closed, players without genscore.spawn.bypassclosed are random-teleported to
    # rtp.zone-destination when they enter the box, and teleports into it (/spawn, homes, tpa) are refused.
    closed-message: '&6&lSPAWN &8» &7Spawn is &cclosed &7right now.'
  end-lock:
    enabled: true
    world: world_the_end
    radius: 900                 # blocks from 0,0 that count as the dragon island
    prevent-dragon: true
    message: '&6&lTHE END &8» &7The dragon island is &cclosed&7. Use &d/rtp end &7to visit the outer islands.'

maintenance:
  reboot:
    enabled: true
    time: '06:00'
    zone: Europe/London
    warning-seconds: [900, 600, 300, 120, 60, 30, 10, 5, 4, 3, 2, 1]
    warning: '&6&lRESTART &8» &7The server restarts in &c{time} &7- it''ll be back in under a minute!'
  mob-cap:
    enabled: true
    max-per-chunk: 40
    trim-on-load: true          # remove the extra when a chunk loads with more
    reasons: [NATURAL, SPAWNER, BREEDING, EGG, DISPENSE_EGG, SPAWNER_EGG, TRIAL_SPAWNER, PATROL, JOCKEY, MOUNT, REINFORCEMENTS]
    exclude: [VILLAGER, WANDERING_TRADER, IRON_GOLEM, ENDER_DRAGON, WITHER, ELDER_GUARDIAN, WARDEN, SHULKER, ALLAY, SNIFFER]
  bedrock-fly-fix: true         # only does anything when Floodgate is installed

sit:
  enabled: true
  require-solid-ground: true
  prevent-sitting-while-sneaking: true
  seat-y-offset: 0.0            # raise/lower the seat if players sink into or float above blocks (needs an in-game look)
  right-click:
    enabled: true
    allowed-block-types: [STAIRS, SLAB, CARPET]   # bottom stairs and bottom slabs only
    require-empty-hand: false
  messages:
    already-sitting: '&eYou are already sitting. Use &f/stand&e to get up.'
    sat-down: '&aYou sat down.'
    stood-up: '&eYou stood up.'
    not-sitting: '&cYou are not sitting.'
    disabled: '&cSitting is currently disabled.'
    cant-sit-here: '&cYou can''t sit here.'
# ---- group L (integration/group-l.md) ----
sus:
  prefix: '<gold><bold>SUS</bold></gold> <dark_gray>»</dark_gray> '
  alert-cooldown-seconds: 60    # one ping per player per check in this time (the list still counts them all)
  hold-millis: 2000             # how long a rate must stay over its limit
  checks: { autoclicker: true, autocrystal: true, autototem: true, nuker: true }
  max-cps: 25                   # left clicks per second (not mining), held for hold-millis
  max-crystals-per-second: 12   # end crystals broken per second, held
  totem-min-ms: 120             # off-hand totem refilled faster than this after a pop (minus ping) = suspicious
  totem-flags-needed: 3         # that many suspicious refills ...
  totem-window-minutes: 10      # ... within this time = one flag
  max-blocks-broken-per-second: 22   # hard blocks, held
  nuker-min-hardness: 0.5       # blocks softer than this (grass, flowers, crops) are not counted

staffmode:
  # Owner only: accounts (UUIDs) whose alt lookup shows a plain result unless the viewer has genscore.hiddenalts.bypass.
  hidden-alts: []

hub:
  cloak:
    tokens: 2                # what a Raid Cloak costs
    seconds: 20              # how long turrets, alarms and players can't see you
    cooldown-seconds: 240
  turbo:
    speed-level: 2           # Speed level for players with genscore.turbo (a donator perk; they can turn it off); 0 = off
  events:
    minutes: 5                # how long a random event lasts (2x money, 2x gen speed, token rush, raid frenzy)
    gap-min-minutes: 20       # time between events, picked at random in this range
    gap-max-minutes: 40
  daily-tasks:
    reward-scale: 1.0        # task rewards are minutes of the player's income times this
    reward-floor: 150        # but never less than this

gameplay:
  no-hunger: true
  # Players can't drop items (creative and genscore.drop.bypass can). No disposal: items stay with you.
  no-item-drops: true
  # Player hits deal no damage (players can't kill players); knockback still works, so the Knockback Rod still
  # pushes. Turrets and the world still hurt.
  no-pvp-damage: true
  # Keep your items and XP when you die.
  keep-inventory: true
  knockback-stick:
    enabled: true
    slot: 9
    level: 5
    name: '&6&lKnockback Stick'

retention:
  # Days for /retention (who is active each day, and who comes back after their first day) use this time zone.
  timezone: America/New_York

modules:
  plots: true
  factory: true
  wipe: true
  lagwatch: true
  retention: true
