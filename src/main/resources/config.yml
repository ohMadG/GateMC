  enabled: true
  check-seconds: 10
  kits: [vip, vipplus, mvp, mvpplus, legend]
  # How each kit is named in the alert (optional; the kit id is used otherwise).
  names:
    vip: '&b&lHexling'
    vipplus: '&9&lHexbound'
    mvp: '&d&lHexborn'
    mvpplus: '&5&lHexlord'
    legend: '&6&lHexmaster'
  title: '&a&lKIT READY'
