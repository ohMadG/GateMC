sus:
  prefix: '<red><bold>SUS</bold> <dark_gray>» '
  alert-cooldown-seconds: 60    # one ping per player per check in this time (the list still counts them all)
  hold-millis: 2000             # how long a rate must stay over its limit
  checks: { autoclicker: true, autocrystal: true, autototem: true, nuker: true }
  max-cps: 25                   # left clicks per second (not mining), held for hold-millis
  max-crystals-per-second: 12   # end crystals broken per second, held
  totem-min-ms: 120             # off-hand totem refilled faster than this after a pop (minus ping) = suspicious
  totem-flags-needed: 3         # that many suspicious refills ...
  totem-window-minutes: 10      # ... within this time = one flag
  max-blocks-broken-per-second: 22   # hard blocks, held
  nuker-min-hardness: 0.5       # blocks softer than this (grass, flowers, crops) are not counted

staffmode:
