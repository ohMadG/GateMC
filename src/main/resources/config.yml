  chat: '&6&lKITS &8» {kits} &fis ready again! &7Claim it with &e/kit'
# ---- group F (integration/group-f.md) ----
# Shards: the second currency (whole numbers). They buy super powers.
shards:
  max-balance: 1000000000
  # The most one /shards give or take can move.
  max-admin-amount: 10000000
  earn:
    enabled: false
    # Shards a minute, AFK or not ("anywhere", as on HXSMP). false = only while not AFK.
    count-afk: true
    base-per-minute: 0.5
    # Per-minute rate for players with genscore.shards.rank.<name>; the best matching rank counts.
    ranks: { vip: 2, vipplus: 3, mvp: 4, mvpplus: 5, legend: 6 }
    # Shown to ranked players when whole shards are paid. '' = off.
    actionbar: '&b+{amount} shards &8| &bShards: &f{shards}'
  top:
    size: 10
    cache-seconds: 60

# Key crates. The crates themselves are in modules/keycrates/crates.yml (/crate reload after editing).
keycrates:
  menu-title: '&c&l❄ &f&lCRATES &c&l❄'
  # One key for every N minutes of playtime. AFK time doesn't count unless count-afk is true.
  playtime:
    crate: amethyst
    minutes: 60
    count-afk: false
  # Every crate win is announced. Wins with a chance below broadcast-under % get the "rare" line.
  broadcast-under: 5.0
  broadcast: '&6&lCRATES &8» &f{player} &7opened a {crate} &7and won {reward}&7!'
  broadcast-rare: '&d&l✦ RARE WIN ✦ &f{player} &7won {reward} &7from the {crate}&7! &8({chance}%)'
  broadcast-bulk: '&6&lCRATES &8» &f{player} &7opened &f{amount}x {crate}&7!'
  # On an open-all, at most this many rare lines are broadcast after the bulk line.
  bulk-rare-lines: 5
  # Rarity labels by chance %.
  rarities:
    - { min: 15,  label: '&7&lCOMMON' }
    - { min: 6,   label: '&a&lUNCOMMON' }
    - { min: 2,   label: '&9&lRARE' }
    - { min: 0.5, label: '&5&lEPIC' }
    - { min: 0,   label: '&6&lLEGENDARY' }
  # Keys of closed crates turn into this many shards each, wherever they turn up (inventory, ender chest, chests,
  # pickups, /claim). Only applies to crates that are not in crates.yml or have enabled: false.
  retired-keys: { afk: 30, vote: 45 }
  # The most keys one "open all" uses.
  open-all-max: 128
  open-cooldown-ms: 600
  # The spinning reel for single opens. false = rewards at once.
  animation: true
  # A free spin for first-time players (once per player, ever).
  welcome-spin:
    enabled: true
    crate: vote
    delay-seconds: 5
    message: '&d&lWELCOME! &7Here''s a free spin of the {crate}&7!'
  # Claim-box rows handled per /claim.
  claim-rows-per-use: 100
# ---- group H (integration/group-h.md) ----
# Season Pass (HXSMP /pass). Free and premium tracks; premium = permission genscore.pass.premium (grant with Tebex/LuckPerms).
# Pass XP comes from daily and weekly challenges. Changing season-id starts a new season (old progress is kept in the
# database under the old id). Rewards: money, shards, keys {crate, amount}, item {material, amount, name, lore, enchants,
# glow}, command (console, {player} = name), each with an optional display text.
seasonpass:
  enabled: true
  season-id: winter-2026
  season-name: 'Winter Season'
  timezone: America/New_York
  # The season runs from start (inclusive) to end (exclusive), in the timezone above.
  start: '2026-12-01T00:00'
  end: '2027-03-01T00:00'
  tier-count: 30
  # Tier N needs N * xp-per-tier XP in total.
  xp-per-tier: 100
  anti-farm:
    # A kill of the same player counts once per this many minutes for each killer.
    same-victim-minutes: 30
    # Mobs from spawners count toward KILL_MOBS challenges.
    count-spawner-mobs: false
    # AFK minutes (essentials AFK) count toward PLAYTIME_MINUTES challenges.
    count-afk-playtime: false
  challenges:
    # How many challenges of each pool are active; picked the same for everyone, new each day / ISO week.
    daily-count: 3
    weekly-count: 3
    # type: KILL_PLAYERS, KILL_MOBS, MINE_BLOCKS, FISH, BREED_ANIMALS, PLAYTIME_MINUTES (counted by GensCore),
    # SELL_ITEMS, OPEN_CRATES (need the hooks in integration/group-h.md, or /pass progress), CUSTOM (/pass progress
    # with the filter as a tag). filter: material / entity type names (empty = anything).
    daily:
      - {id: mine-stone, type: MINE_BLOCKS, amount: 500, xp: 40, filter: [STONE, DEEPSLATE, COBBLESTONE], name: '&fMine 500 stone'}
      - {id: mine-ores, type: MINE_BLOCKS, amount: 32, xp: 50, filter: [COAL_ORE, IRON_ORE, GOLD_ORE, DIAMOND_ORE, DEEPSLATE_COAL_ORE, DEEPSLATE_IRON_ORE, DEEPSLATE_GOLD_ORE, DEEPSLATE_DIAMOND_ORE, ANCIENT_DEBRIS], name: '&fMine 32 ores'}
      - {id: kill-mobs, type: KILL_MOBS, amount: 50, xp: 40, name: '&fKill 50 mobs'}
      - {id: kill-zombies, type: KILL_MOBS, amount: 25, xp: 35, filter: [ZOMBIE, HUSK, DROWNED, ZOMBIE_VILLAGER], name: '&fKill 25 zombies'}
      - {id: kill-players, type: KILL_PLAYERS, amount: 3, xp: 60, name: '&fKill 3 players'}
      - {id: fish, type: FISH, amount: 15, xp: 40, name: '&fCatch 15 fish'}
      - {id: breed, type: BREED_ANIMALS, amount: 10, xp: 30, name: '&fBreed 10 animals'}
      - {id: play-60, type: PLAYTIME_MINUTES, amount: 60, xp: 50, name: '&fPlay for an hour'}
      - {id: sell-items, type: SELL_ITEMS, amount: 500, xp: 40, name: '&fSell 500 items'}
    weekly:
      - {id: kill-players-w, type: KILL_PLAYERS, amount: 25, xp: 250, name: '&fKill 25 players'}
      - {id: kill-mobs-w, type: KILL_MOBS, amount: 500, xp: 200, name: '&fKill 500 mobs'}
      - {id: mine-w, type: MINE_BLOCKS, amount: 5000, xp: 200, name: '&fMine 5,000 blocks'}
      - {id: diamonds-w, type: MINE_BLOCKS, amount: 64, xp: 250, filter: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE], name: '&fMine 64 diamond ore'}
      - {id: play-w, type: PLAYTIME_MINUTES, amount: 600, xp: 250, name: '&fPlay for 10 hours'}
      - {id: crates-w, type: OPEN_CRATES, amount: 10, xp: 200, name: '&fOpen 10 crates'}
      - {id: fish-w, type: FISH, amount: 100, xp: 200, name: '&fCatch 100 fish'}
  # Rewards per tier. Tiers not listed have no reward on that track. Placeholder amounts: tune them for the economy.
  tiers:
    1:  {free: [{money: 1000}], premium: [{shards: 25}, {keys: {crate: vote, amount: 1}}]}
    2:  {free: [{item: {material: COOKED_BEEF, amount: 32}}], premium: [{money: 5000}]}
