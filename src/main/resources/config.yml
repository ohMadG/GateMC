store:
  url: 'https://store.gatemc.org'
  link-label: '&6&l[CLICK FOR STORE]'
  message:
    - '&6&lSTORE &8» &7Ranks, crate keys & more: {store}'
  # Each Tebex package runs (as console):  storeadmin purchase {username} <item name>
  purchase-announce:
    format: '&6&lSTORE &8» &e{player} &7just bought {item}&7! &8» &bClick to visit the store'
    hover: '&7Click to open the store'
  # Completed payments are read from the Tebex plugin API with the secret key that is ALREADY in the Tebex plugin's
  # own config file. Never copy the key here. config-file is relative to the plugins folder.
  tebex:
    enabled: true
    config-file: 'Tebex/config.yml'
    # Where the key sits in that file; the first one found is used.
    key-paths: [server.secret-key, secret-key, secret]
    refresh-minutes: 10
    # After the first full read, each refresh reads new pages plus this many to catch refunds and chargebacks.
    recheck-pages: 2
    max-pages: 200
  # The "spenders" leaderboard (/leaderboard spenders, and /lbholo place spenders). All-time completed payments.
  top-spenders:
    enabled: true
    exclude: []
    currency-symbol: '$'
  popup:
    enabled: true
    cooldown-minutes: 15
    title: 'GATEMC STORE'
    message: 'Ranks, credits, super powers and base styles. Every purchase helps keep GateMC running!'
    open-button: 'Open store'
    close-button: 'Not now'
    chat-link: true
    zones: 
      - { world: world, min: [1122, 60, 1122], max: [1182, 110, 1182] }
    # - { world: world, min: [-42, 158, 23], max: [-31, 176, 43] }
  # Community goal: this month's completed payments (in timezone) against target. /goal shows it.
  goal:
    enabled: true
    target: 500.00
    timezone: 'UTC'
    bar-length: 20
    line: '&6&lCOMMUNITY GOAL &8» &f{current} &7/ &f{target} &8[{bar}&8] &f{percent}%'
    reached-broadcast: '&6&lCOMMUNITY GOAL &8» &7This month''s store goal of &f{target} &7was reached! Everyone online gets a reward.'
    # Given once per month to everyone online when the goal is reached.
    reward:
      money: 0
      console-commands: []
      player-commands: []     # {player} = each online player's name
  # Store party: a Tebex package runs  storeadmin party {username} {transaction}
  party:
    enabled: true
    countdown-seconds: 10
    # Pay one account per IP address, so a party can't be multiplied with alts.
    one-per-ip: true
    start-broadcast: '&6&lSTORE PARTY &8» &f{player} &7started a store party! Rewards in &f{seconds}s&7...'
    done-broadcast: '&6&lSTORE PARTY &8» &7Everyone online got a reward. Say thanks to &f{player}&7!'
    reward:
      money: 250
      console-commands: []
      player-commands: []
  # Played for everyone when a Tebex package runs  storeadmin purchase {username} <item>  (and by /storeadmin celebrate).
  # During the GG wave, "gg" in chat shows in rainbow and skips the chat cooldown.
  celebration:
    enabled: true
    sound: 'hawkmc:donation'
    volume: 0.6
    gg-wave-seconds: 15
    repeat-gap-seconds: 10
    title: '&6&l{player}'
    subtitle: '&fsupported GateMC! &7Type &a&lGG'
    bossbar: '&6&lGG WAVE &8- &fthank &e{player}'
    gg-wave-broadcast: '&6&lGG WAVE! &fType &a&lGG &fin chat to thank &e{player}&f! &7({seconds}s)'
  # Every "every" dollars of completed store payments (counted from when this was first turned on) gives everyone
  # online the reward once. Progress shows on the scoreboard (%genscore_keyall%): {current} into this step, {step}, {left}.
  key-all:
    enabled: true
    every: 25.0
    scoreboard: '&f{current}&7/&f{step}'
    reached-broadcast: '&6&lKEY ALL &8» &7The store hit &f{step}&7! Everyone online gets a key.'
    reward:
      money: 0
      console-commands: ['crate giveall cosmetic 1']
      player-commands: []

