  check-seconds: 10
  kits: [vip, vipplus, mvp, mvpplus, legend]
  # How each kit is named in the alert (optional; the kit id is used otherwise).
  names:
    vip: '&b&lMechanic'
    vipplus: '&9&lMachinist'
    mvp: '&d&lOverseer'
    mvpplus: '&5&lIndustrialist'
    legend: '&6&lTycoon'
  title: '&a&lKIT READY'
