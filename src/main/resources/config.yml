        sell:     { slot: 23, material: HOPPER,        name: '&6/sell',     lore: ['&7Drop items in, close to sell.'], command: sell }
        multi:    { slot: 24, material: NETHER_STAR,   name: '&e/sellmulti', lore: ['&7Your sell multipliers.'], command: sellmulti }
