        vipplus: { slot: 21, material: GOLD_INGOT,  name: '&9&lHexbound',  command: store, lore: ['&8┃ &9Hexbound &7badge', '&8┃ &7Hexling + Hexbound kits'] }
        mvp:     { slot: 22, material: DIAMOND,     name: '&d&lHexborn',   glow: true, command: store, lore: ['&8┃ &dHexborn &7badge', '&8┃ &7All kits up to Hexborn'] }
        mvpplus: { slot: 23, material: EMERALD,     name: '&5&lHexlord',   glow: true, command: store, lore: ['&8┃ &5Hexlord &7badge', '&8┃ &7All kits up to Hexlord'] }
        legend:  { slot: 24, material: NETHER_STAR, name: '&6&lHexmaster', glow: true, command: store, lore: ['&8┃ &6Hexmaster &7badge', '&8┃ &7Every kit'] }
        media:   { slot: 31, material: PINK_DYE,    name: '&d&lMEDIA', command: discord, lore: ['&7For YouTubers & streamers.', '&7Apply in our Discord!'] }
        crates:  { slot: 40, material: ENDER_CHEST, name: '&5&lCrate keys', command: store, lore: ['&7Keys are on the store too.'] }

store:
  url: 'https://hxsmp.tebex.store'
  link-label: '&6&l[CLICK FOR STORE]'
  message:
    - '&6&lSTORE &8» &7Ranks, crate keys & more: {store}'
  # Each Tebex package runs (as console):  storeadmin purchase {username} <item name>
  purchase-announce:
    format: '&8[&6&lSTORE&8] &e{player} &7just bought {item}&7! &8» &bClick to visit the store'
    hover: '&7Click to open the store'
  # Completed payments are read from the Tebex plugin API with the secret key that is ALREADY in the Tebex plugin's
  # own config file. Never copy the key here. config-file is relative to the plugins folder.
  tebex:
    enabled: true
    config-file: 'Tebex/config.yml'
    # Where the key sits in that file; the first one found is used.
    key-paths: [server.secret-key, secret-key, secret]
    refresh-minutes: 10
    # After the first full read, each refresh reads new pages plus this many to catch refunds and chargebacks.
    recheck-pages: 2
    max-pages: 200
  # The "spenders" leaderboard (/leaderboard spenders, and /lbholo place spenders). All-time completed payments.
  top-spenders:
    enabled: true
    exclude: []
    currency-symbol: '$'
  popup:
    enabled: true
    cooldown-minutes: 10
    title: 'STORE'
    message: 'Crate keys, ranks and bundles - bundles save up to 40%! Every purchase helps keep the server running.'
    open-button: 'Open store'
    close-button: 'Not now'
    chat-link: true
    zones: []
    # - { world: world, min: [-42, 158, 23], max: [-31, 176, 43] }
  # Community goal: this month's completed payments (in timezone) against target. /goal shows it.
  goal:
    enabled: true
    target: 500.00
    timezone: 'UTC'
    bar-length: 20
    line: '&d&lCOMMUNITY GOAL &8» &f{current} &7/ &f{target} &8[{bar}&8] &f{percent}%'
    reached-broadcast: '&d&lCOMMUNITY GOAL &8» &7This month''s store goal of &f{target} &7was reached! Everyone online gets a reward.'
    # Given once per month to everyone online when the goal is reached.
    reward:
      money: 0
      console-commands: []
      player-commands: []     # {player} = each online player's name
  # Store party: a Tebex package runs  storeadmin party {username} {transaction}
  party:
    enabled: true
    countdown-seconds: 10
    # Pay one account per IP address, so a party can't be multiplied with alts.
    one-per-ip: true
    start-broadcast: '&d&lSTORE PARTY &8» &f{player} &7started a store party! Rewards in &f{seconds}s&7...'
    done-broadcast: '&d&lSTORE PARTY &8» &7Everyone online got a reward. Say thanks to &f{player}&7!'
    reward:
      money: 250
      console-commands: []
      player-commands: []

