# Powers (/powers). One power is active at a time and switching is free.
# Powers are bought once with tokens (cost); the first one is free.
# Super powers (op: true) cost credits (cost), the store currency; "powers grant <player|uuid> <power>" also
# gives one from the console. /powers super shows them.
# Active powers fire on a double-tap of sneak. Reload with /powers reload.
#
# Passive numbers are added on top of upgrades while the power is active:
#   belt-speed / sale-value / luck / raid-loot / turret-damage / cache-money: 0.15 = +15%
#   token-double: chance a belt token pays double. cache-upgrade: extra chance a cache holds a better one.
#   gate-seconds: extra seconds the gate stays shut. repair-speed: 0.5 = broken belts mend 50% sooner.
#   raid-damage: extra damage per Raid Pick hit. raid-defense: 0.5 = raiders do half damage to your belt.
# Durations and cooldowns are in seconds.

