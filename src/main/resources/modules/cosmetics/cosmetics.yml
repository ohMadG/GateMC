# GateMC cosmetics (/cosmetics, /wardrobe, /cos; /tags opens chat tags). Reload with /cosmetics reload.
#
# Ownership: a player owns a cosmetic when they have its permission (genscore.cosmetics.<category>.<id>, store ranks
# through LuckPerms), a stored unlock (crates: cosmetics give <player> <category> <id>), or bought it in the menu.
# price: credits to buy it in the menu (0 or missing = not sold, crates only). "free: true" gives it to everyone.
#
# Name paints and some chat colours/tags use the animated shader colours #FE04FD (1) ... #FE64FD (25): the resource
# pack's text shader turns text in those exact colours into flowing palettes everywhere (chat, tab list, menus).
# Text uses & colour codes (&#rrggbb for hex). Ids: a-z, 0-9, _ and - (up to 32).

settings:
  locked-hint: "&7Unlock it from crates."
  # Hide auras and glows while invisible (would give away a hidden player's position).
  hide-when-invisible: true
  auras:
    # How often each player's aura is drawn (2-20 ticks), on the player's own thread.
    interval-ticks: 3
  glows:
    # Multi-colour glows switch colour this often (TAB refreshes %genscore_glow% at least this fast).
    cycle-seconds: 1.0

# /homeicon (permission genscore.homeicon, for paid ranks).
home-icons:
  max-per-player: 32
  allow-held-item: true
  choices: [RED_BED, CHEST, ENDER_CHEST, CRAFTING_TABLE, FURNACE, ANVIL, ENCHANTING_TABLE, BEACON, DIAMOND, EMERALD,
            GOLD_INGOT, IRON_INGOT, NETHERITE_INGOT, DIAMOND_SWORD, DIAMOND_PICKAXE, BOW, SHIELD, TOTEM_OF_UNDYING,
            WHEAT, OAK_SAPLING, CACTUS, SUGAR_CANE, SPAWNER, OBSIDIAN, GRASS_BLOCK, SAND, NETHERRACK, END_STONE,
            OAK_BOAT, MINECART, COMPASS, CLOCK, MAP, BOOK, CAMPFIRE, LANTERN, SKELETON_SKULL, DRAGON_HEAD,
            HEART_OF_THE_SEA, NETHER_STAR, ELYTRA, TRIDENT, FISHING_ROD, CAKE, BELL]

