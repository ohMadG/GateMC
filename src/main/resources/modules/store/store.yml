# The /store menu. Java players with the resource pack get the store screen (tabs, 3 cards per page, cart rewards,
# cart, checkout); everyone else (and Bedrock) gets a plain chest menu with the same cart. /storelink still sends the
# plain store link. Reload with /gensadmin reload.
#
# Checkout: with a Tebex Headless public token, Checkout builds a Tebex basket for the player and sends a pay link in
# chat. Without one (or while an item in the cart has package: 0) it lists the cart and links store.url.
#
# art: a vanilla texture from modules/store/art.txt (item/... or block/...), drawn big on the card, small in the cart.
# highlights: up to 9 lines. "* text" is a main line with a bullet, "- text" a smaller sub line. &-colours work.
#   Main lines fit about 20 letters, sub lines about 18.
# contents: up to 5 "what's inside" icons (art + name shown in the View screen).
# price is only what the menu shows; Tebex charges its own package price.
# max: how many of one product fit in the cart.
#
# cart-rewards are only shown in the menu (up to 2 tiers). Deliver them yourself, e.g. with a Tebex sale or a
# package command, before advertising them.

