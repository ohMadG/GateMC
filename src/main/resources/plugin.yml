name: GensCore
version: '${project.version}'
main: me.Evan52098.genscore.GensCore
api-version: '1.21'
folia-supported: true
description: Core plugin for the gens server (plots, belts, raiding, economy).
# Downloaded by the server at startup, so the jar stays small. Keep versions in step with pom.xml.
# SQLite needs nothing here: the server already includes its driver.
libraries:
  - com.zaxxer:HikariCP:7.0.2
  - org.postgresql:postgresql:42.7.13
  - io.github.revxrsal:lamp.common:4.0.0-rc.18
  - io.github.revxrsal:lamp.bukkit:4.0.0-rc.18
  - io.github.revxrsal:lamp.brigadier:4.0.0-rc.18
permissions:
  genscore.belt: {default: true}
  genscore.trust: {default: true}
  genscore.discord.admin: {default: op}
  genscore.nitro: {default: false}
  genscore.factory.bypass: {default: false}
  genscore.plot: {default: true}
  genscore.admin.plots: {default: op}
  genscore.plots.build: {default: op}
  genscore.admin.reload: {default: op}
  genscore.balance: {default: true}
  genscore.pay: {default: true}
  genscore.pay.toggle: {default: true}
  genscore.pay.confirm.toggle: {default: true}
  genscore.baltop: {default: true}
  genscore.balance.others: {default: op}
  genscore.admin.eco: {default: op}
  genscore.home: {default: true}
  genscore.sethome: {default: true}
  genscore.delhome: {default: true}
  genscore.renamehome: {default: true}
  genscore.homes.unlimited: {default: false}
  genscore.warp: {default: true}
  genscore.warp.list: {default: true}
  genscore.setwarp: {default: op}
  genscore.delwarp: {default: op}
  genscore.spawn: {default: true}
  genscore.setspawn: {default: op}
  genscore.tpa: {default: true}
  genscore.back: {default: op}
  genscore.top: {default: op}
  genscore.teleport.bypasswarmup: {default: op}
  # essentials: player commands default to everyone, the rest to ops (adjust with LuckPerms)
  genscore.msg: {default: true}
  genscore.ignore: {default: true}
  genscore.afk: {default: true}
  genscore.seen: {default: true}
  genscore.playtime: {default: true}
  genscore.rules: {default: true}
  genscore.kill: {default: true}
  genscore.disposal: {default: true}
  genscore.enderchest: {default: op}
  genscore.craft: {default: op}
  genscore.anvil: {default: op}
  genscore.near: {default: op}
  genscore.nickname: {default: op}
  genscore.realname: {default: true}
  genscore.msg.bypass: {default: op}
  genscore.ignore.exempt: {default: op}
  genscore.socialspy: {default: op}
  genscore.nickname.admin: {default: op}
  genscore.nickname.bypasscooldown: {default: op}
  genscore.heal: {default: op}
  genscore.heal.others: {default: op}
  genscore.feed: {default: op}
  genscore.feed.others: {default: op}
  genscore.fly: {default: op}
  genscore.fly.others: {default: op}
  genscore.god: {default: op}
  genscore.god.others: {default: op}
  genscore.speed: {default: op}
  genscore.speed.others: {default: op}
  genscore.gamemode.survival: {default: op}
  genscore.gamemode.creative: {default: op}
  genscore.gamemode.adventure: {default: op}
  genscore.gamemode.spectator: {default: op}
  genscore.gamemode.others: {default: op}
  genscore.exp: {default: true}
  genscore.exp.others: {default: op}
  genscore.ptime: {default: op}
  genscore.pweather: {default: op}
  genscore.hat: {default: op}
  genscore.ci: {default: op}
  genscore.ci.others: {default: op}
  genscore.admin.give: {default: op}
  genscore.fix: {default: op}
  genscore.fix.bypasscooldown: {default: op}
  genscore.itemrename: {default: op}
  genscore.itemrename.color: {default: op}
  genscore.itemlore: {default: op}
  genscore.echest.view: {default: op}
  genscore.echest.edit: {default: op}
  genscore.invsee.view: {default: op}
  genscore.invsee.edit: {default: op}
  # chat
  genscore.chat.color: {default: op}
  genscore.chat.alerts: {default: op}
  genscore.chat.bypass.filter: {default: op}
  genscore.chat.bypass.cooldown: {default: op}
  genscore.drop.bypass: {default: op}              # may drop items (gameplay.no-item-drops)
  genscore.chat.filter.admin: {default: op}       # /filter add|deny (live word list changes)
  genscore.mute: {default: op}                    # /mute, /unmute
  genscore.clearchat: {default: op}
  genscore.clearchat.exempt: {default: op}
  genscore.broadcast: {default: op}
  # staff
  genscore.vanish: {default: op}
  genscore.vanish.others: {default: op}
  genscore.vanish.see: {default: op}
  genscore.staffchat: {default: op}
  genscore.adminchat: {default: op}
  genscore.freeze: {default: op}
  genscore.freeze.exempt: {default: op}
  genscore.commandspy: {default: op}
  genscore.commandspy.exempt: {default: false}
  genscore.signspy: {default: op}
  genscore.staff.alerts: {default: op}
  genscore.invhistory: {default: op}
  genscore.report: {default: true}
  genscore.reports: {default: op}
  # punish
  genscore.punish.gui: {default: op}      # /punish, /p, /warn and the punish menu
  genscore.punish: {default: op}          # /punishment, /history, /checkban, /altcheck
  genscore.punish.approve: {default: op}  # revoke mutes/warns (bans need action.unban)
  genscore.punish.admin: {default: op}    # admin actions menu, alt-ban-evasion exemptions, staff lockouts
  genscore.punish.category.chat: {default: true}
  genscore.punish.category.severeconduct: {default: true}
  genscore.punish.category.gameplaycheating: {default: true}
  genscore.punish.category.accountsecurity: {default: true}
  # punish - per-rank action permissions (grant per staff group: guide = warn+mute,
  # helper = +kick, mod = +ban, admin = +unban, owner = +blacklist)
  genscore.punish.action.warn: {default: op}
  genscore.punish.action.mute: {default: op}
  genscore.punish.action.kick: {default: op}
  genscore.punish.action.ban: {default: op}
  genscore.punish.action.unban: {default: op}
  genscore.punish.action.blacklist: {default: op}
  # kits, vaults, announcements
  genscore.kit: {default: true}
  genscore.kits.admin: {default: op}
  genscore.kits.bypasscooldown: {default: op}
  genscore.vault: {default: true}
  genscore.buyvault: {default: true}
  genscore.vaults.others: {default: op}
  genscore.vaults.unlimited: {default: false}
  genscore.announcements.admin: {default: op}
  genscore.announcements.hide: {default: false}
  # crates (Daily Lockbox), vouchers, daily
  genscore.lockbox.play: {default: true}
  genscore.lockbox.admin.inspect: {default: op}
  genscore.lockbox.admin.reload: {default: op}
  genscore.lockbox.admin.reconcile: {default: op}
  genscore.voucher.check: {default: true}
  genscore.admin.voucher: {default: op}
  genscore.command.daily: {default: true}
  genscore.admin.dailyreward: {default: op}
  # auction, sell, homes
  # settings, trade, mail, polls, leaderboards
  genscore.command.settings: {default: true}
  genscore.tptoggle: {default: true}
  genscore.tp.toggle.bypass: {default: op}
  genscore.prefs: {default: op}
  genscore.trade: {default: true}
  genscore.mail: {default: true}
  genscore.admin.poll: {default: op}
  genscore.leaderboard: {default: true}
  genscore.admin.leaderboards: {default: op}
  # anti x-ray, anti-hack, lag watch, wipe
  genscore.antihack.alert: {default: op}
  genscore.antihack.admin: {default: op}
  genscore.antihack.bypass: {default: op}
  genscore.admin.wipe: {default: op}
  # ---- HXSMP groups E-N ----
  # info
  genscore.info: {default: true}
  # store
  genscore.store: {default: true}
  genscore.store.admin: {default: op}
  genscore.store.popup.exempt: {default: false}
  # ranks
  genscore.tags: {default: true}
  # (genscore.tag.<id> unlocks a tag; badges use LuckPerms' group.<id> or the permission set per badge)
  # shards
  genscore.shards: {default: true}
  genscore.shards.others: {default: true}
  genscore.shards.top: {default: true}
  genscore.shards.admin: {default: op}
  genscore.credits: {default: true}
  genscore.credits.others: {default: true}
  genscore.credits.top: {default: true}
  genscore.credits.admin: {default: op}
  # (genscore.shards.rank.<name> for the per-minute rates under shards.earn.ranks; grant with LuckPerms)
  # key crates
  genscore.keycrates: {default: true}
  genscore.keycrates.admin: {default: op}
  # super powers
  genscore.powers: {default: true}
  genscore.powers.admin: {default: op}
  genscore.pets: {default: true}
  genscore.pets.admin: {default: op}
  genscore.basestyle: {default: true}
  genscore.hub: {default: true}
  genscore.weekly: {default: true}
  genscore.merchant: {default: true}
  genscore.merchant.admin: {default: op}
  genscore.manager.1: {default: false}   # Foreman free (rank perk)
  genscore.manager.2: {default: false}   # Supervisor free
  genscore.manager.3: {default: false}   # Director free
  genscore.turbo: {default: op}       # Turbo speed: a donator perk, grant to ranks with LuckPerms
  genscore.intro: {default: true}
  genscore.gate.remote: {default: false}
  genscore.admin.events: {default: op}
  genscore.admin.reward: {default: op}
  genscore.basestyle.admin: {default: op}
  # season pass
  genscore.pass: {default: true}
  genscore.pass.premium: {default: false}   # the premium track: grant with Tebex / LuckPerms
  genscore.pass.admin: {default: op}        # /pass progress, /pass xp give|set
  # holidays
  # sell multipliers (the menu uses genscore.sell, which group A already adds)
  # shop
  # orders
  # (genscore.order.limit.<number> raises the open-order cap; grant with LuckPerms)
  # gamble
  # reputation
  genscore.reputation: {default: true}
  genscore.reputation.staff: {default: op}
  genscore.reputation.admin: {default: op}
  # chat games
  genscore.chatgames.start: {default: op}
  # rtp
  # worldrules
  genscore.worldrules.admin: {default: op}
  genscore.spawn.bypassclosed: {default: op}
  genscore.endlock.bypass: {default: op}    # only works in creative or spectator (HxCore rule)
  # arena
  # maintenance
  genscore.reboot: {default: op}
  # mobspawns
  # sit
  genscore.sit: {default: true}
  genscore.sit.admin: {default: op}
  # drills (SEBDrill: sebdrill.use, .give, .admin, .settings, .bonemash.use, .bonemash.give)
  # spawners (SEBSmartSpawners: sebsmartspawners.admin); /spawnerrecipes needs no permission
  # structures (HxCore: hxcore.structures, hxcore.stashundo; SEBStaff: sebstaff.spawnstash)
  # combat
  # sus
  genscore.sus: {default: op}                   # /sus and alerts (was hxcore.sus)
  genscore.sus.tp: {default: op}                # [TP] buttons and /sustp (was hxcore.sus.tp)
  genscore.sus.exempt: {default: false}         # never flagged
  # staff mode and extras
  genscore.staffmode: {default: op}             # /staffmode (was sebstaff.staffmode)
  genscore.staffmode.bypass: {default: false}   # keep F3 coordinates and /sethome in staff mode (was hxcore.staffmode.bypass)
  genscore.supervanish: {default: false}        # owner: when vanished, hidden even from staff (was hxcore.supervanish)
  genscore.supervanish.see: {default: false}    # can see a super-vanished owner (was hxcore.supervanish.see)
  genscore.hiddenalts.bypass: {default: false}  # sees real alt results for hidden accounts (was hxcore.hiddenalts.bypass)
  genscore.allhomes: {default: op}              # /allhomes (was hxcore.allhomes)
  genscore.cosmetics: {default: true}        # /cosmetics
  genscore.cosmetics.admin: {default: op}    # give/revoke/reload; also owns every cosmetic
  genscore.homeicon: {default: false}        # /homeicon, grant to paid ranks (was hxcore.homes.style)
  # Each cosmetic: genscore.cosmetics.<category>.<id>, e.g. genscore.cosmetics.auras.flame_halo,
  # genscore.cosmetics.name-colors.galaxy. Grant with LuckPerms (store ranks). Categories: join-messages,
  # leave-messages, chat-tags, name-colors, chat-colors, auras, glows.
softdepend:
  - Vault
  - LuckPerms
  - PlaceholderAPI
  - floodgate
  - FastAsyncWorldEdit
  - packetevents
  - FancyNpcs
